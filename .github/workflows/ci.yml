# Veröffentlicht wird nicht hier: Cloudflare Pages hängt am Repository und
# baut jeden Push auf `main` selbst. Dieser Workflow prüft nur — und weil
# Cloudflare unabhängig davon ausliefert, ist ein roter Lauf hier kein
# Deployment-Stopp. Wer das will, trägt in den Pages-Einstellungen `npm test`
# als Build-Befehl ein; dann bricht auch dort ein fehlgeschlagener Test ab.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rechenlogik und Release-Invarianten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
